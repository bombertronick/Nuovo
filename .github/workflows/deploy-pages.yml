name: Deploy Gestionale su GitHub Pages

# Pubblica l'app come sito statico su GitHub Pages ad ogni push.
# Usa la sorgente "GitHub Actions" e prova ad abilitare Pages automaticamente.

on:
  push:
    branches:
      - main
      - claude/app-gestionale-cantieri-o1nfxg
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages (abilita se serve)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepara i file statici
        run: |
          mkdir -p _site
          cp index.html gestionale.html manifest.webmanifest sw.js _site/
          cp -r assets icons _site/

      - name: Carica artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy su Pages
        id: deployment
        uses: actions/deploy-pages@v4
