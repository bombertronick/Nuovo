name: Deploy Gestionale su GitHub Pages

# Pubblica l'app come sito statico su GitHub Pages.
#
# ATTIVAZIONE (una tantum, da fare a mano nelle impostazioni del repo):
#   1. Se il repository è privato e sei su piano gratuito, rendilo pubblico
#      (Settings → General → Change visibility) — GitHub Pages gratuito
#      funziona solo su repo pubblici.
#   2. Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Fatto questo, lancia il deploy da Actions → "Deploy Gestionale su GitHub
# Pages" → "Run workflow" (oppure ad ogni push su main).
#
# In alternativa, senza questo workflow: Settings → Pages → "Deploy from a
# branch" → branch corrente, cartella "/ (root)".

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Prepara i file statici
        run: |
          mkdir -p _site
          cp index.html gestionale.html manifest.webmanifest sw.js _site/
          cp -r assets icons _site/

      - name: Carica artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy su Pages
        id: deployment
        uses: actions/deploy-pages@v4
