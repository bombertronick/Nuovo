<title>Gestionale Cantieri</title>
<style>
/* =========================================================================
   Gestionale Cantieri — Foglio di stile
   Mobile-first, tema chiaro/scuro automatico. Nessuna dipendenza esterna.
   ========================================================================= */

:root {
  --primary: #1e5eff;
  --primary-dark: #1546c4;
  --primary-soft: #e8efff;
  --accent: #ffb300;        /* giallo "elettrico" */
  --accent-dark: #e09e00;

  --ok: #16a34a;
  --ok-soft: #e6f6ec;
  --warn: #d97706;
  --warn-soft: #fdf1dd;
  --danger: #dc2626;
  --danger-soft: #fbe6e6;

  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-soft: #64748b;
  --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .06);
  --shadow-lg: 0 10px 30px rgba(15, 23, 42, .12);
  --radius: 14px;
  --radius-sm: 10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* Token del tema scuro, riusati sia dalla preferenza di sistema sia dal
   toggle esplicito del visualizzatore (data-theme). */
@media (prefers-color-scheme: dark) {
  :root {
    --primary: #5b8bff;
    --primary-dark: #3b6ff0;
    --primary-soft: #16244a;
    --accent: #ffc23d;
    --accent-dark: #e0a52a;

    --ok: #4ade80;
    --ok-soft: #10321f;
    --warn: #fbbf24;
    --warn-soft: #34260c;
    --danger: #f87171;
    --danger-soft: #3a1414;

    --bg: #0b1020;
    --surface: #131a2e;
    --surface-2: #0f1526;
    --border: #263149;
    --text: #e9eefb;
    --text-soft: #93a1bd;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
    --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
  }
}

/* Il toggle del visualizzatore stampa data-theme sul root: deve vincere
   sulla preferenza di sistema in entrambe le direzioni. */
:root[data-theme="dark"] {
  --primary: #5b8bff;
  --primary-dark: #3b6ff0;
  --primary-soft: #16244a;
  --accent: #ffc23d;
  --accent-dark: #e0a52a;
  --ok: #4ade80;
  --ok-soft: #10321f;
  --warn: #fbbf24;
  --warn-soft: #34260c;
  --danger: #f87171;
  --danger-soft: #3a1414;
  --bg: #0b1020;
  --surface: #131a2e;
  --surface-2: #0f1526;
  --border: #263149;
  --text: #e9eefb;
  --text-soft: #93a1bd;
  --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
}
:root[data-theme="light"] {
  --primary: #1e5eff;
  --primary-dark: #1546c4;
  --primary-soft: #e8efff;
  --accent: #ffb300;
  --accent-dark: #e09e00;
  --ok: #16a34a;
  --ok-soft: #e6f6ec;
  --warn: #d97706;
  --warn-soft: #fdf1dd;
  --danger: #dc2626;
  --danger-soft: #fbe6e6;
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-soft: #64748b;
  --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .06);
  --shadow-lg: 0 10px 30px rgba(15, 23, 42, .12);
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* ------------------------------ Layout ---------------------------------- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  padding: 14px 16px calc(14px);
  box-shadow: var(--shadow);
}
.app-header .brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.app-header .logo {
  width: 40px; height: 40px;
  border-radius: 11px;
  background: var(--accent);
  color: #1a1a1a;
  display: grid; place-items: center;
  font-size: 22px;
  flex: 0 0 auto;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
}
.app-header h1 {
  font-size: 1.05rem;
  margin: 0;
  line-height: 1.15;
  font-weight: 700;
}
.app-header .sub {
  font-size: .74rem;
  opacity: .85;
  margin: 0;
}
.app-header .header-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}
.icon-btn {
  background: rgba(255,255,255,.16);
  border: none;
  color: #fff;
  width: 38px; height: 38px;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  display: grid; place-items: center;
  transition: background .15s;
}
.icon-btn:hover { background: rgba(255,255,255,.28); }

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px 16px calc(96px + var(--safe-bottom));
}

.view { animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.section-title {
  font-size: .82rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--text-soft);
  font-weight: 700;
  margin: 22px 4px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .count {
  background: var(--border);
  color: var(--text-soft);
  border-radius: 20px;
  padding: 1px 9px;
  font-size: .72rem;
}

/* ------------------------------ Cards ----------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}

/* Riepilogo IVA */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 620px) { .summary-grid { grid-template-columns: repeat(4, 1fr); } }

.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.stat .label {
  font-size: .72rem;
  color: var(--text-soft);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .03em;
  display: flex; align-items: center; gap: 5px;
}
.stat .value {
  font-size: 1.28rem;
  font-weight: 800;
  margin-top: 4px;
  letter-spacing: -.02em;
}
.stat.debito .value { color: var(--primary); }
.stat.credito .value { color: var(--ok); }
.stat.netta   .value { color: var(--warn); }
.stat.netta.credito-favore .value { color: var(--ok); }
.stat.margine .value { color: var(--text); }
.stat .hint { font-size: .68rem; color: var(--text-soft); margin-top: 2px; }

/* ------------------------- Categorie / filtri --------------------------- */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.chip {
  flex: 0 0 auto;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 30px;
  padding: 7px 14px;
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all .15s;
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.chip.active {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: var(--primary-dark);
}
.chip.manage { border-style: dashed; color: var(--text-soft); }

/* ------------------------- Lista cantieri ------------------------------- */
.cantiere-group { margin-bottom: 8px; }

.cantiere-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 5px solid var(--cat, var(--primary));
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: transform .12s, box-shadow .12s;
  display: block;
  width: 100%;
  text-align: left;
}
.cantiere-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.cantiere-card .cc-top {
  display: flex; align-items: flex-start; gap: 10px;
}
.cantiere-card .cc-name { font-weight: 700; font-size: 1.02rem; }
.cantiere-card .cc-client { color: var(--text-soft); font-size: .85rem; }
.cantiere-card .cc-meta {
  display: flex; flex-wrap: wrap; gap: 8px 14px;
  margin-top: 10px; font-size: .8rem; color: var(--text-soft);
}
.cantiere-card .cc-meta b { color: var(--text); font-weight: 700; }
.badge {
  font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
}
.badge.cat { color: #fff; }
.badge.stato-attivo { background: var(--primary-soft); color: var(--primary-dark); }
.badge.stato-completato { background: var(--ok-soft); color: var(--ok); }
.badge.attach { background: var(--warn-soft); color: var(--warn); }
.ml-auto { margin-left: auto; }

/* ------------------------------ Bottoni --------------------------------- */
.btn {
  appearance: none;
  border: 1.5px solid transparent;
  border-radius: var(--radius-sm);
  padding: 11px 16px;
  font-size: .92rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: filter .15s, background .15s, transform .1s;
  text-decoration: none;
  font-family: inherit;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { filter: brightness(1.05); }
.btn-accent { background: var(--accent); color: #1a1a1a; }
.btn-accent:hover { filter: brightness(1.03); }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-danger:hover { filter: brightness(.97); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: .84rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Floating action button */
.fab {
  position: fixed;
  right: 18px;
  bottom: calc(18px + var(--safe-bottom));
  z-index: 30;
  background: var(--accent);
  color: #1a1a1a;
  border: none;
  border-radius: 50%;
  width: 60px; height: 60px;
  font-size: 30px;
  box-shadow: var(--shadow-lg);
  cursor: pointer;
  display: grid; place-items: center;
  transition: transform .12s;
}
.fab:active { transform: scale(.93); }

/* --------------------------- Dettaglio cantiere ------------------------- */
.detail-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
}
.back-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px; width: 40px; height: 40px;
  font-size: 20px; cursor: pointer; flex: 0 0 auto; box-shadow: var(--shadow);
}
.detail-header h2 { margin: 0; font-size: 1.2rem; }
.detail-header .dh-sub { color: var(--text-soft); font-size: .85rem; }

.info-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid var(--border); font-size: .92rem;
}
.info-row:last-child { border-bottom: none; }
.info-row .k { color: var(--text-soft); }
.info-row .v { font-weight: 600; text-align: right; }

/* Spese / righe fattura */
.expense-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 8px; background: var(--surface-2);
}
.expense-row .ex-icon {
  width: 38px; height: 38px; border-radius: 9px; flex: 0 0 auto;
  display: grid; place-items: center; font-size: 18px;
  background: var(--surface); border: 1px solid var(--border);
}
.expense-row .ex-body { flex: 1 1 auto; min-width: 0; }
.expense-row .ex-title { font-weight: 700; font-size: .92rem; }
.expense-row .ex-sub { font-size: .76rem; color: var(--text-soft); }
.expense-row .ex-amount { text-align: right; flex: 0 0 auto; }
.expense-row .ex-amount .tot { font-weight: 800; }
.expense-row .ex-amount .iva { font-size: .72rem; color: var(--ok); }

.attachment-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .78rem; color: var(--primary); text-decoration: none; font-weight: 600;
  margin-top: 2px;
}

.empty {
  text-align: center; padding: 40px 20px; color: var(--text-soft);
}
.empty .big { font-size: 46px; margin-bottom: 8px; }
.empty p { margin: 6px 0; }

/* ------------------------------ Modale ---------------------------------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(15, 23, 42, .55);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0;
  animation: fade .15s ease;
}
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 20px; }
}
.modal {
  background: var(--surface);
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  overflow-y: auto;
  border-radius: 20px 20px 0 0;
  box-shadow: var(--shadow-lg);
  animation: slideup .22s ease;
  padding-bottom: calc(16px + var(--safe-bottom));
}
@media (min-width: 640px) { .modal { border-radius: 20px; } }
@keyframes slideup { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }

.modal-head {
  position: sticky; top: 0; background: var(--surface);
  padding: 18px 18px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; z-index: 2;
}
.modal-head h3 { margin: 0; font-size: 1.08rem; flex: 1 1 auto; }
.modal-head .close { background: var(--surface-2); border: 1px solid var(--border);
  width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font-size: 18px; color: var(--text); }
.modal-body { padding: 16px 18px; }
.modal-foot {
  padding: 12px 18px; display: flex; gap: 10px;
  position: sticky; bottom: 0; background: var(--surface);
  border-top: 1px solid var(--border);
}

/* ------------------------------ Form ------------------------------------ */
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: .8rem; font-weight: 700;
  color: var(--text-soft); margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 12px; font-size: 16px; /* 16px evita zoom su iOS */
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--text); font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--primary); background: var(--surface);
}
.field textarea { min-height: 70px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field .hint { font-size: .72rem; color: var(--text-soft); margin-top: 4px; font-weight: 400; }

.seg { display: flex; gap: 0; border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.seg button {
  flex: 1; padding: 10px; background: var(--surface-2); border: none;
  color: var(--text-soft); font-weight: 700; cursor: pointer; font-size: .88rem; font-family: inherit;
}
.seg button.active { background: var(--primary); color: #fff; }

/* file picker */
.file-drop {
  border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
  padding: 14px; text-align: center; background: var(--surface-2); cursor: pointer;
  font-size: .85rem; color: var(--text-soft);
}
.file-drop.has-file { border-style: solid; border-color: var(--ok); color: var(--text); background: var(--ok-soft); }
.file-current { display: flex; align-items: center; gap: 8px; justify-content: center; font-weight: 600; }

/* mini riepilogo iva nel form */
.iva-preview {
  background: var(--primary-soft); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: .85rem; display: flex; justify-content: space-between;
  color: var(--primary-dark); font-weight: 700; margin-top: 4px;
}

/* proiezione: effetto della spesa sull'IVA netta prevista */
.iva-proj {
  margin-top: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface-2); padding: 10px 12px;
}
.iva-proj .proj-title {
  font-size: .72rem; font-weight: 800; color: var(--text-soft);
  text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px;
}
.iva-proj .proj-row {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: .86rem; padding: 4px 0; gap: 10px;
}
.iva-proj .proj-row span { color: var(--text); }
.iva-proj .proj-row em { color: var(--text-soft); font-style: normal; font-size: .76rem; }
.iva-proj .proj-row b { font-weight: 800; white-space: nowrap; }
.iva-proj .proj-row .add { color: var(--ok); font-size: .72rem; font-weight: 800; }
.iva-proj .proj-row.net {
  border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 8px; font-size: .92rem;
}
.iva-proj .proj-row.net span { font-weight: 700; }
.iva-proj .proj-row.net b.versare { color: var(--warn); }
.iva-proj .proj-row.net b.credito { color: var(--ok); }
.iva-proj .proj-row.net b.ok { color: var(--ok); }
.iva-proj .proj-row.net b.warn { color: var(--warn); }

/* conto cliente (bonifici) */
.conto-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.conto-item {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.conto-item .cl { font-size: .72rem; color: var(--text-soft); font-weight: 600; }
.conto-item .cv { font-size: 1.05rem; font-weight: 800; margin-top: 2px; }
.conto-item .ch { font-size: .66rem; color: var(--text-soft); margin-top: 1px; }
.conto-item.big { border-color: var(--primary); }
.conto-item.big .cv { font-size: 1.22rem; }
.conto-item .cv.due { color: var(--primary); }
.conto-item .cv.ok { color: var(--ok); }
.conto-item .cv.warn { color: var(--warn); }

/* ===================== Interfaccia semplificata ========================= */

/* Sintesi in cima alla dashboard (3 numeri chiave) */
.top-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ts-tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 13px 8px; text-align: center;
}
.ts-tile .ts-label { font-size: .66rem; font-weight: 800; color: var(--text-soft); text-transform: uppercase; letter-spacing: .02em; }
.ts-tile .ts-value { font-size: clamp(.9rem, 4.4vw, 1.2rem); font-weight: 800; margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ts-tile .ts-sub { font-size: .62rem; color: var(--text-soft); margin-top: 2px; }
.ts-tile.net .ts-value { color: var(--warn); }
.ts-tile.net.ok .ts-value { color: var(--ok); }
.ts-tile.bon .ts-value { color: var(--primary); }
.ts-tile.disp .ts-value { color: var(--ok); }
.ts-tile.clickable {
  cursor: pointer; font-family: inherit; -webkit-appearance: none; appearance: none;
  transition: transform .1s, box-shadow .12s, border-color .12s;
}
.ts-tile.clickable:hover { box-shadow: var(--shadow-lg); border-color: var(--primary); }
.ts-tile.clickable:active { transform: scale(.98); }
.ts-tile.bon .ts-label { color: var(--primary); }

/* intestazioni raggruppamento incassi */
.section-title.incassi-head {
  justify-content: space-between; text-transform: none; letter-spacing: 0;
  font-size: .92rem; color: var(--text);
}
.section-title.incassi-head .grp-tot { color: var(--primary); font-weight: 800; font-variant-numeric: tabular-nums; }

/* Mini sintesi in cima al cantiere */
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.mini-stats .ms {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 6px; text-align: center; box-shadow: var(--shadow);
}
.mini-stats .ms-l { font-size: .6rem; color: var(--text-soft); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
.mini-stats .ms-v { font-size: clamp(.82rem, 4vw, 1.05rem); font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }

/* Tab rapidi nel cantiere */
.ctabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.ctabs.ctabs-4 { grid-template-columns: repeat(2, 1fr); }
.ctab {
  position: relative; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 12px 4px; cursor: pointer; color: var(--text-soft);
  font-weight: 700; font-size: .76rem; line-height: 1.15; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: inherit;
  transition: border-color .12s, background .12s, color .12s;
}
.ctab .ct-ic { font-size: 22px; }
.ctab.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); box-shadow: var(--shadow); }
.ctab .ct-n {
  position: absolute; top: 6px; right: 8px; background: var(--primary); color: #fff;
  border-radius: 20px; font-size: .62rem; padding: 1px 6px; font-weight: 800; line-height: 1.4;
}
.ctab-content { animation: fade .18s ease; }

/* Tendina laterale (menu) */
.drawer-backdrop {
  position: fixed; inset: 0; z-index: 55; background: rgba(15, 23, 42, .5);
  opacity: 0; transition: opacity .2s;
}
.drawer-backdrop.open { opacity: 1; }
.drawer {
  position: absolute; top: 0; right: 0; height: 100%; width: min(84vw, 340px);
  background: var(--surface); box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .22s ease;
  padding-bottom: calc(8px + var(--safe-bottom));
}
.drawer-backdrop.open .drawer { transform: none; }
.drawer-head {
  display: flex; align-items: center; gap: 12px; padding: 18px 16px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
}
.drawer-head .dh-logo {
  width: 40px; height: 40px; border-radius: 11px; background: var(--accent); color: #1a1a1a;
  display: grid; place-items: center; font-size: 22px; flex: 0 0 auto;
}
.drawer-head .dh-name { font-weight: 800; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-head .dh-role { font-size: .72rem; opacity: .85; }
.drawer-close {
  margin-left: auto; background: rgba(255, 255, 255, .18); border: none; color: #fff;
  width: 34px; height: 34px; border-radius: 9px; font-size: 16px; cursor: pointer; flex: 0 0 auto;
}
.drawer-items { padding: 10px; overflow-y: auto; flex: 1 1 auto; }
.drawer-item {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 12px;
  background: transparent; border: none; border-radius: var(--radius-sm); cursor: pointer;
  color: var(--text); font-size: .94rem; font-weight: 600; font-family: inherit; text-align: left;
}
.drawer-item:hover { background: var(--surface-2); }
.drawer-item .di-ic { font-size: 20px; width: 26px; text-align: center; flex: 0 0 auto; }
.drawer-item .di-tx { flex: 1 1 auto; }
.drawer-item .di-count { background: var(--border); color: var(--text-soft); border-radius: 20px; font-size: .7rem; padding: 1px 8px; font-weight: 800; }
.drawer-item .di-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
.drawer-sep { height: 1px; background: var(--border); margin: 8px 6px; }
.drawer-foot { text-align: center; font-size: .74rem; color: var(--text-soft); padding: 12px; }

/* Categorie manager */
.cat-item {
  display: flex; align-items: center; gap: 10px; padding: 8px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px;
}
.cat-item input[type=text] { flex: 1; padding: 8px 10px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); }
.cat-item input[type=color] { width: 40px; height: 38px; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--surface-2); cursor: pointer; }
.cat-item button { background: var(--danger-soft); color: var(--danger); border: none; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 16px; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(90px + var(--safe-bottom));
  transform: translateX(-50%);
  background: var(--text); color: var(--bg);
  padding: 11px 18px; border-radius: 30px; font-size: .88rem; font-weight: 600;
  box-shadow: var(--shadow-lg); z-index: 60; opacity: 0; transition: opacity .2s, transform .2s;
  pointer-events: none; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

.hidden { display: none !important; }

/* progress bar sotto header per completamento cantiere */
.mini-note { font-size: .8rem; color: var(--text-soft); margin: 2px 4px 0; }

.divider { height: 1px; background: var(--border); margin: 16px 0; border: none; }

.row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.row-actions .btn { flex: 1 1 auto; }

.tag-tipo { font-size: .68rem; padding: 2px 7px; border-radius: 6px; background: var(--border); color: var(--text-soft); font-weight: 700; }
.bon-tag { font-size: .62rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; letter-spacing: .03em; }
.bon-tag.acconto { background: var(--primary-soft); color: var(--primary-dark); }
.bon-tag.extra { background: var(--ok-soft); color: var(--ok); }

/* ------------------------- Strumenti (dashboard) ------------------------ */
.tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tools-grid.tools-3 { grid-template-columns: repeat(3, 1fr); }
.tool-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px 10px; cursor: pointer; color: var(--text);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-weight: 700; font-size: .84rem; text-align: center; line-height: 1.2; font-family: inherit;
  transition: transform .12s, box-shadow .12s;
}
.tool-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.tool-btn .ti { font-size: 26px; }

/* ------------------------------ Banner scadenze ------------------------- */
.scad-banner {
  width: 100%; margin-top: 12px; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-around; gap: 10px;
  font-size: .82rem; color: var(--text-soft); font-weight: 600; font-family: inherit; text-align: center;
}
.scad-banner b { display: block; font-size: 1.05rem; color: var(--text); margin-top: 2px; }
.scad-banner .sep { width: 1px; height: 34px; background: var(--border); }
.scad-banner:hover { box-shadow: var(--shadow-lg); }

/* --------------------------- Badge pagamento ---------------------------- */
.pay-badge { font-size: .68rem; font-weight: 800; padding: 2px 8px; border-radius: 20px; letter-spacing: .02em; }
.pay-badge.paid { background: var(--ok-soft); color: var(--ok); }
.pay-badge.due { background: var(--warn-soft); color: var(--warn); }

/* --------------------------- Tabella trimestri -------------------------- */
.tri-head, .tri-row {
  display: grid; grid-template-columns: 1.7fr 1fr 1fr 1fr; gap: 6px; align-items: center;
  padding: 9px 4px; font-size: .82rem; text-align: right;
}
.tri-head { font-size: .68rem; text-transform: uppercase; letter-spacing: .03em; color: var(--text-soft); font-weight: 700; border-bottom: 1.5px solid var(--border); }
.tri-head span:first-child, .tri-row .tri-nome { text-align: left; }
.tri-row { border-bottom: 1px solid var(--border); }
.tri-row .tri-nome { font-weight: 600; font-size: .8rem; }
.tri-row.tri-tot { border-top: 2px solid var(--border); border-bottom: none; font-weight: 800; margin-top: 2px; }
.tri-row.tri-tot .tri-nome { font-weight: 800; }

/* ---------------------------- Voci preventivo --------------------------- */
.voci-table { margin: 10px 0; border-top: 1px solid var(--border); }
.voce-line { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: .86rem; align-items: center; }
.voce-line .d { flex: 1 1 auto; min-width: 0; }
.voce-line .q { color: var(--text-soft); font-size: .78rem; white-space: nowrap; }
.voce-line .t { font-weight: 700; white-space: nowrap; min-width: 70px; text-align: right; }

.voce-input { margin-bottom: 10px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); }
.voce-input > input { width: 100%; padding: 9px 10px; font-size: 16px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); margin-bottom: 8px; }
.voce-nums { display: flex; align-items: center; gap: 6px; }
.voce-nums input { flex: 1; padding: 9px 8px; font-size: 16px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); min-width: 0; }
.voce-nums .times { color: var(--text-soft); font-weight: 700; }
.voce-nums .voce-del { background: var(--danger-soft); color: var(--danger); border: none; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; font-size: 15px; flex: 0 0 auto; }

.prev-badge { font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
.prev-badge.s-bozza { background: var(--border); color: var(--text-soft); }
.prev-badge.s-inviato { background: var(--primary-soft); color: var(--primary-dark); }
.prev-badge.s-accettato { background: var(--ok-soft); color: var(--ok); }
.prev-badge.s-rifiutato { background: var(--danger-soft); color: var(--danger); }

/* ------------------------------ Galleria foto --------------------------- */
.foto-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
@media (min-width: 520px) { .foto-grid { grid-template-columns: repeat(4, 1fr); } }

      </div>

      </div>
    </div>

  <main id="app">
    <div class="empty"><div class="big">⚡</div><p>Caricamento in corso…</p></div>
  </main>

  <button class="fab" id="fab" title="Nuovo cantiere" aria-label="Nuovo cantiere">＋</button>
<script>
/* =========================================================================
   db.js — Persistenza locale con IndexedDB
   - Un archivio "kv" per lo stato dell'app (JSON: categorie, cantieri, spese)
   - Un archivio "files" per gli allegati (fatture in foto/PDF salvate come Blob)
   Tutto resta sul dispositivo dell'utente. Nessun server, nessun invio online.
   ========================================================================= */
(function (global) {
  'use strict';

  const DB_NAME = 'gestionale-cantieri';
  const DB_VERSION = 1;
  const STORE_KV = 'kv';
  const STORE_FILES = 'files';
  const STATE_KEY = 'state';

  let _db = null;

  function open() {
    return new Promise((resolve, reject) => {
      if (_db) return resolve(_db);
      if (!global.indexedDB) return reject(new Error('IndexedDB non supportato su questo browser.'));
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_KV)) db.createObjectStore(STORE_KV);
        if (!db.objectStoreNames.contains(STORE_FILES)) db.createObjectStore(STORE_FILES);
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }

  function tx(store, mode) {
    return open().then((db) => db.transaction(store, mode).objectStore(store));
  }

  function reqToPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  // ---- Stato applicazione (JSON) ----
  async function loadState() {
    const store = await tx(STORE_KV, 'readonly');
    return reqToPromise(store.get(STATE_KEY));
  }
  async function saveState(state) {
    const store = await tx(STORE_KV, 'readwrite');
    return reqToPromise(store.put(state, STATE_KEY));
  }

  // ---- Allegati (Blob) ----
  async function saveFile(id, blob) {
    const store = await tx(STORE_FILES, 'readwrite');
    return reqToPromise(store.put(blob, id));
  }
  async function getFile(id) {
    const store = await tx(STORE_FILES, 'readonly');
    return reqToPromise(store.get(id));
  }
  async function deleteFile(id) {
    if (!id) return;
    const store = await tx(STORE_FILES, 'readwrite');
    return reqToPromise(store.delete(id));
  }
  async function getAllFileKeys() {
    const store = await tx(STORE_FILES, 'readonly');
    return reqToPromise(store.getAllKeys());
  }

  // ---- Backup / Ripristino (esporta tutto: dati + allegati in base64) ----
  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(blob);
    });
  }
  function dataURLToBlob(dataURL) {
    const [head, b64] = dataURL.split(',');
    const mime = (head.match(/data:(.*?);base64/) || [])[1] || 'application/octet-stream';
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  async function exportAll(state) {
    const keys = await getAllFileKeys();
    const files = {};
    for (const k of keys) {
      const blob = await getFile(k);
      if (blob) files[k] = await blobToDataURL(blob);
    }
    return { format: 'gestionale-cantieri-backup', version: 1, exportedAt: new Date().toISOString(), state, files };
  }

  async function importAll(backup) {
    if (!backup || backup.format !== 'gestionale-cantieri-backup') {
      throw new Error('File di backup non valido.');
    }
    // ripristina allegati
    if (backup.files) {
      for (const k of Object.keys(backup.files)) {
        await saveFile(k, dataURLToBlob(backup.files[k]));
      }
    }
    if (backup.state) await saveState(backup.state);
    return backup.state;
  }

  global.DB = {
    loadState, saveState,
    saveFile, getFile, deleteFile, getAllFileKeys,
    exportAll, importAll
  };
})(window);

</script>
<script>
/* =========================================================================
   app.js — Gestionale Cantieri
   Logica dell'applicazione, calcolo IVA, interfaccia.
   Nessun framework: JavaScript puro, funziona offline e da file locale.
   ========================================================================= */
(function () {
  'use strict';

  /* --------------------------- Stato applicazione ---------------------------
     state = {
       azienda: string,
       categorie: [ {id, nome, colore} ],
       cantieri: [ {
          id, nome, cliente, indirizzo, categoriaId, stato('attivo'|'completato'),
          dataInizio, dataFine, note,
          fatturaOrigine: {numero, data, imponibile, aliquota, fileId, fileName} | null,
          spese: [ {id, descrizione, tipo('materiale'|'utensile'), fornitore, numeroDoc,
                    data, imponibile, aliquota, fileId, fileName} ]
       } ],
       speseGenerali: [ ...come spese ]
     }
  --------------------------------------------------------------------------- */

  let state = null;

  const DEFAULT_STATE = () => ({
    azienda: 'La mia impresa',
    categorie: [
      { id: uid(), nome: 'Ristrutturazioni', colore: '#1e5eff' },
      { id: uid(), nome: 'Impianti elettrici', colore: '#ffb300' },
      { id: uid(), nome: 'Manutenzioni', colore: '#16a34a' },
      { id: uid(), nome: 'Nuove costruzioni', colore: '#8b5cf6' }
    ],
    cantieri: [],
    speseGenerali: []
  });

  const ALIQUOTE = [22, 10, 4, 0]; // aliquote IVA italiane comuni
  const DEFAULT_ALIQUOTA = 22;

  /* --------------------------------- Router --------------------------------- */
  let route = { name: 'dashboard', id: null };
  let dashboardFilter = 'tutte'; // id categoria oppure 'tutte'

  /* --------------------------------- Utilità -------------------------------- */
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function euro(n) {
    const v = Number(n) || 0;
    return v.toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
  }

  function num(v) {
    if (typeof v === 'number') return v;
    if (!v) return 0;
    return parseFloat(String(v).replace(',', '.')) || 0;
  }

  function ivaOf(imponibile, aliquota) {
    return num(imponibile) * (num(aliquota) / 100);
  }
  function totaleOf(imponibile, aliquota) {
    return num(imponibile) + ivaOf(imponibile, aliquota);
  }
  // Ritenuta d'acconto (es. 4% ritenuta condominiale): calcolata sull'imponibile
  function ritenutaOf(f) { return f ? num(f.imponibile) * (num(f.ritenuta) / 100) : 0; }
  // Netto effettivamente incassato dal cliente = totale fattura − ritenuta
  function nettoIncassoFattura(f) { return f ? totaleOf(f.imponibile, f.aliquota) - ritenutaOf(f) : 0; }

  // Numerazione automatica: cerca il progressivo massimo dell'anno e incrementa
  function prossimoProgressivo(kind) {
    const y = annoOf(todayISO());
    let max = 0;
    state.cantieri.forEach(c => {
      const n = kind === 'preventivo' ? (c.preventivo && c.preventivo.numero) : (c.fatturaOrigine && c.fatturaOrigine.numero);
      if (!n) return;
      const m = String(n).match(/(\d{4})\s*[\/\-]\s*0*(\d+)/);
      if (m && parseInt(m[1], 10) === y) max = Math.max(max, parseInt(m[2], 10));
    });
    return max + 1;
  }
  function prossimoNumeroFattura() { return annoOf(todayISO()) + '/' + String(prossimoProgressivo('fattura')).padStart(3, '0'); }
  function prossimoNumeroPreventivo() { return 'P-' + annoOf(todayISO()) + '/' + String(prossimoProgressivo('preventivo')).padStart(2, '0'); }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function todayISO() {
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function getCategoria(id) {
    return state.categorie.find(c => c.id === id) || null;
  }

  function categoriaColore(id) {
    const c = getCategoria(id);
    return c ? c.colore : '#94a3b8';
  }
  function categoriaNome(id) {
    const c = getCategoria(id);
    return c ? c.nome : 'Senza categoria';
  }

  /* ------------------------- Calcoli IVA aggregati -------------------------- */
  // Riepilogo IVA per un cantiere: debito (fattura al cliente) - credito (spese)
  function cantiereRiepilogo(cant) {
    const debito = cant.fatturaOrigine ? ivaOf(cant.fatturaOrigine.imponibile, cant.fatturaOrigine.aliquota) : 0;
    // Costi MATERIALI/utensili (blocco "materiali")
    let ivaCreditoMateriali = 0, costiMateriali = 0;
    (cant.spese || []).forEach(s => {
      ivaCreditoMateriali += ivaOf(s.imponibile, s.aliquota);
      costiMateriali += num(s.imponibile);
    });
    // Costi COLLABORATORI (blocco "collaboratori": stessa logica dei materiali)
    let ivaCreditoCollab = 0, costiCollaboratori = 0;
    (cant.collaboratori || []).forEach(s => {
      ivaCreditoCollab += ivaOf(s.imponibile, s.aliquota);
      costiCollaboratori += num(s.imponibile);
    });
    const credito = ivaCreditoMateriali + ivaCreditoCollab;   // IVA a credito totale (materiali + collaboratori)
    const costiImponibile = costiMateriali + costiCollaboratori; // costi totali che riducono il margine
    const ricavoImponibile = cant.fatturaOrigine ? num(cant.fatturaOrigine.imponibile) : 0;
    // Bonifici divisi per tipo: 'acconto' (sul lavoro concordato) vs 'extra' (lavoro aggiuntivo)
    let accontiTotale = 0, extraTotale = 0;
    (cant.bonifici || []).forEach(b => {
      const imp = num(b.importo);
      if (b.tipo === 'extra') extraTotale += imp; else accontiTotale += imp;
    });
    const bonificiTotale = accontiTotale + extraTotale;
    // Gli extra sono lavoro aggiuntivo pagato: si sommano ai ricavi
    const ricaviTotali = ricavoImponibile + extraTotale;
    return {
      ivaDebito: debito,
      ivaCredito: credito,
      ivaNetta: debito - credito,       // > 0 = IVA da versare, < 0 = credito IVA
      ricavoImponibile,                 // solo lavoro base (fattura)
      ricaviTotali,                     // fattura + extra
      costiMateriali, costiCollaboratori,
      costiImponibile,
      // MARGINE: usa SOLO ricavi e costi. NON contiene la cassa materiali.
      margine: ricaviTotali - costiImponibile,
      bonificiTotale, accontiTotale, extraTotale,
      // SOLDI DA RISCUOTERE: solo imponibile fattura - acconti. NON contiene la cassa materiali.
      daIncassareImponibile: ricavoImponibile - accontiTotale,
      // CASSA MATERIALI: flusso separato = bonifici ricevuti - SOLO costi materiali.
      // Non entra nel margine né nei soldi da riscuotere.
      cassaMateriali: bonificiTotale - costiMateriali
    };
  }

  // Riepilogo globale: tutti i cantieri + spese generali
  function globalRiepilogo() {
    let debito = 0, credito = 0, ricavo = 0, costi = 0, bonifici = 0;
    state.cantieri.forEach(c => {
      const r = cantiereRiepilogo(c);
      debito += r.ivaDebito; credito += r.ivaCredito;
      ricavo += r.ricaviTotali; costi += r.costiImponibile;   // ricavi = fatture + extra
      bonifici += r.bonificiTotale;
    });
    (state.speseGenerali || []).forEach(s => {
      credito += ivaOf(s.imponibile, s.aliquota);
      costi += num(s.imponibile);
    });
    const ivaNetta = debito - credito;
    return {
      ivaDebito: debito, ivaCredito: credito, ivaNetta,
      ricavoImponibile: ricavo, costiImponibile: costi, margine: ricavo - costi,
      bonificiTotale: bonifici,
      // IVA (netta da versare) da accantonare sui bonifici già riscossi
      ivaDaAccantonare: Math.max(0, ivaNetta),
      // quanto resta dei bonifici dopo aver accantonato l'IVA (mai negativo)
      bonificiDisponibile: Math.max(0, bonifici - Math.max(0, ivaNetta))
    };
  }

  /* ------------------------------ Persistenza ------------------------------- */
  let saveTimer = null;
  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      DB.saveState(state).catch(err => {
        console.error(err);
        toast('⚠️ Errore nel salvataggio dati');
      });
    }, 120);
  }

  /* -------------------------------- Toast ----------------------------------- */
  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast'; el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ============================== RENDERING ================================= */
  const app = () => document.getElementById('app');

  function render() {
    updateHeader();
    if (route.name === 'dashboard') renderDashboard();
    else if (route.name === 'cantiere') renderCantiere(route.id);
    else if (route.name === 'archivio') renderArchivio();
    else if (route.name === 'scadenzario') renderScadenzario();
    else if (route.name === 'riepilogo') renderRiepilogoPeriodo();
    else if (route.name === 'statistiche') renderStatistiche();
    else if (route.name === 'spesegenerali') renderSpeseGenerali();
    else if (route.name === 'incassi') renderIncassi();
    else renderDashboard();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function updateHeader() {
    const sub = document.getElementById('header-sub');
    if (sub) sub.textContent = state.azienda || 'Gestionale Cantieri';
  }

  /* ----------------------------- DASHBOARD ---------------------------------- */
  function renderDashboard() {
    const attivi = state.cantieri.filter(c => c.stato === 'attivo');
    const completati = state.cantieri.filter(c => c.stato === 'completato');
    const g = globalRiepilogo();

    // filtro categorie
    let filtered = attivi;
    if (dashboardFilter !== 'tutte') {
      filtered = attivi.filter(c => (c.categoriaId || 'nessuna') === dashboardFilter);
    }

    // raggruppa per categoria
    const groups = {};
    filtered.forEach(c => {
      const k = c.categoriaId || 'nessuna';
      (groups[k] = groups[k] || []).push(c);
    });
    // ordina categorie secondo l'ordine definito, poi "senza categoria"
    const orderedKeys = state.categorie.map(c => c.id).filter(k => groups[k]);
    if (groups['nessuna']) orderedKeys.push('nessuna');

    let html = '';
    html += `<section class="view">`;

    // --- Sintesi azienda: 3 numeri distinti (nessun dato ripetuto) ---
    const nettaFavore = g.ivaNetta < 0;
    html += `<div class="top-summary">
      <div class="ts-tile net ${nettaFavore ? 'ok' : ''}">
        <div class="ts-label">IVA netta</div>
        <div class="ts-value">${euro(Math.abs(g.ivaNetta))}</div>
        <div class="ts-sub">${nettaFavore ? 'a tuo credito' : 'da versare'}</div>
      </div>
      <button class="ts-tile bon clickable" data-action="open-incassi">
        <div class="ts-label">Bonifici incassati ›</div>
        <div class="ts-value">${euro(g.bonificiTotale)}</div>
        <div class="ts-sub">tocca per dettaglio</div>
      </button>
      <div class="ts-tile disp">
        <div class="ts-label">Disponibile</div>
        <div class="ts-value">${euro(g.bonificiDisponibile)}</div>
        <div class="ts-sub">dai bonifici, dopo l'IVA</div>
      </div>
    </div>`;

    // --- Categorie / filtro ---
    html += `<div class="section-title" style="margin-top:20px">🏗️ Cantieri attivi <span class="count">${attivi.length}</span></div>`;
    html += `<div class="chips">`;
    html += chip('tutte', 'Tutte', null, dashboardFilter === 'tutte');
    state.categorie.forEach(c => {
      const n = attivi.filter(x => x.categoriaId === c.id).length;
      html += chip(c.id, `${c.nome}${n ? ' · ' + n : ''}`, c.colore, dashboardFilter === c.id);
    });
    const senza = attivi.filter(x => !x.categoriaId).length;
    if (senza) html += chip('nessuna', `Senza categoria · ${senza}`, '#94a3b8', dashboardFilter === 'nessuna');
    html += `</div>`;

    // --- Lista cantieri raggruppati ---
    if (!attivi.length) {
      html += emptyState('🏗️', 'Nessun cantiere attivo', 'Tocca il pulsante + in basso per aggiungere il tuo primo cantiere.');
    } else if (!filtered.length) {
      html += emptyState('🔍', 'Nessun cantiere in questa categoria', 'Cambia filtro oppure aggiungi un nuovo cantiere.');
    } else {
      orderedKeys.forEach(k => {
        const cat = getCategoria(k);
        const nome = cat ? cat.nome : 'Senza categoria';
        const col = cat ? cat.colore : '#94a3b8';
        html += `<div class="cantiere-group">`;
        html += `<div class="section-title"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:${col};display:inline-block"></span> ${esc(nome)} <span class="count">${groups[k].length}</span></div>`;
        groups[k].forEach(c => { html += cantiereCard(c); });
        html += `</div>`;
      });
    }

    // --- Archivio completati ---
    html += `<div class="section-title" style="margin-top:24px">✅ Cantieri completati <span class="count">${completati.length}</span></div>`;
    html += `<button class="btn btn-ghost btn-block" data-action="open-archivio">📁 Apri archivio completati (${completati.length})</button>`;

    html += `</section>`;
    app().innerHTML = html;

    caricaAllegatiVisibili();
    document.getElementById('fab').classList.remove('hidden');
  }

  function summaryGrid(r, showMargine) {
    const nettaFavore = r.ivaNetta < 0;
    return `<div class="summary-grid">
      <div class="stat debito">
        <div class="label">↗ IVA a debito</div>
        <div class="value">${euro(r.ivaDebito)}</div>
        <div class="hint">incassata dai clienti</div>
      </div>
      <div class="stat credito">
        <div class="label">↘ IVA a credito</div>
        <div class="value">${euro(r.ivaCredito)}</div>
        <div class="hint">su materiali e utensili</div>
      </div>
      <div class="stat netta ${nettaFavore ? 'credito-favore' : ''}">
        <div class="label">= IVA netta</div>
        <div class="value">${euro(Math.abs(r.ivaNetta))}</div>
        <div class="hint">${nettaFavore ? 'a tuo credito' : 'da versare'}</div>
      </div>
      ${showMargine ? `<div class="stat margine">
        <div class="label">€ Margine</div>
        <div class="value">${euro(r.margine)}</div>
        <div class="hint">ricavi − costi (imponibile)</div>
      </div>` : ''}
    </div>`;
  }

  function chip(id, label, colore, active) {
    const dot = colore ? `<span class="dot" style="background:${colore}"></span>` : '';
    return `<button class="chip ${active ? 'active' : ''}" data-action="filter" data-id="${id}">${dot}${esc(label)}</button>`;
  }

  function cantiereCard(c) {
    const col = categoriaColore(c.categoriaId);
    const r = cantiereRiepilogo(c);
    const hasFattura = !!c.fatturaOrigine;
    const nSpese = (c.spese || []).length;
    return `<button class="cantiere-card" style="--cat:${col}" data-action="open-cantiere" data-id="${c.id}">
      <div class="cc-top">
        <div style="flex:1 1 auto;min-width:0">
          <div class="cc-name">${esc(c.nome)}</div>
          <div class="cc-client">${c.cliente ? esc(c.cliente) : 'Cliente non indicato'}${c.indirizzo ? ' · ' + esc(c.indirizzo) : ''}</div>
        </div>
        <span class="badge cat" style="background:${col}">${esc(categoriaNome(c.categoriaId))}</span>
      </div>
      <div class="cc-meta">

  function emptyState(icon, title, text) {

  /* ====================== ALLEGATI (apertura da IndexedDB) ================== */
  const objectUrls = [];
  function releaseUrls() { objectUrls.forEach(u => URL.revokeObjectURL(u)); objectUrls.length = 0; }

  async function openFile(fileId) {
    try {
      const blob = await DB.getFile(fileId);
      if (!blob) return toast('Allegato non trovato');
      const url = URL.createObjectURL(blob);
      objectUrls.push(url);
      window.open(url, '_blank');
    } catch (e) { toast('Impossibile aprire l\'allegato'); }
  }
  // Carica le miniature delle foto (Blob da IndexedDB -> object URL) dopo il render.
  async function caricaAllegatiVisibili() {
    const imgs = document.querySelectorAll('img[data-thumb]');
    for (const img of imgs) {
      if (img.dataset.loaded) continue;
      const id = img.dataset.thumb;
      try {
        const blob = await DB.getFile(id);
        if (blob) {
          const url = URL.createObjectURL(blob);
          objectUrls.push(url);
          img.src = url;
          img.dataset.loaded = '1';
        }
      } catch (e) { /* ignora */ }
    }
  }

  /* ============================== MODALI =================================== */
  function openModal(title, bodyHtml, footHtml) {
    closeModal();
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.id = 'modal-backdrop';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="close" data-action="close-modal">✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
      ${footHtml ? `<div class="modal-foot">${footHtml}</div>` : ''}
    </div>`;
    back.addEventListener('click', (e) => { if (e.target === back) closeModal(); });
    document.body.appendChild(back);
  }
  function closeModal() {
    const b = document.getElementById('modal-backdrop');
    if (b) b.remove();
  }

  function saveCantiere(id) {
    const nome = document.getElementById('f-nome').value.trim();
    if (!nome) { toast('Inserisci il nome del cantiere'); return; }
    const data = {
      nome,
      cliente: document.getElementById('f-cliente').value.trim(),
      indirizzo: document.getElementById('f-indirizzo').value.trim(),
      categoriaId: document.getElementById('f-categoria').value || '',
      dataInizio: document.getElementById('f-inizio').value || '',
      dataFine: document.getElementById('f-fine').value || '',
      note: document.getElementById('f-note').value.trim()
    };
    if (id) {
      const c = state.cantieri.find(x => x.id === id);
      Object.assign(c, data);
      toast('Cantiere aggiornato');
    } else {
      const c = Object.assign({ id: uid(), stato: 'attivo', fatturaOrigine: null, preventivo: null, spese: [], collaboratori: [], foto: [], bonifici: [] }, data);
      state.cantieri.unshift(c);
      route = { name: 'cantiere', id: c.id };
      toast('Cantiere creato');
    }
    persist();
    closeModal();
    render();
  }

  function wireFatturaPreview() {
    const upd = () => {
      const imp = num(document.getElementById('ff-imponibile').value);
      const aliq = num(document.getElementById('ff-aliquota').value);
      const rit = num(document.getElementById('ff-ritenuta').value);
      const iva = ivaOf(imp, aliq);
      const tot = imp + iva;
      document.getElementById('ff-preview').innerHTML = `<span>IVA: ${euro(iva)}</span><span>Totale: ${euro(tot)}</span>`;
      const nettoEl = document.getElementById('ff-netto');
      const ritImporto = imp * rit / 100;
      if (rit > 0) {
        nettoEl.style.display = '';
        nettoEl.innerHTML = `<span>Ritenuta ${rit}%: −${euro(ritImporto)}</span><span>Netto a incassare: ${euro(tot - ritImporto)}</span>`;
      } else {
        nettoEl.style.display = 'none';
      }
    };
    document.getElementById('ff-imponibile').addEventListener('input', upd);
    document.getElementById('ff-aliquota').addEventListener('change', upd);
    document.getElementById('ff-ritenuta').addEventListener('input', upd);
    upd();
  }

  async function saveFattura(cantId) {
    const c = state.cantieri.find(x => x.id === cantId);
    const imponibile = num(document.getElementById('ff-imponibile').value);
    if (!imponibile) { toast('Inserisci l\'imponibile della fattura'); return; }
    const prev = c.fatturaOrigine || {};
    let fileId = prev.fileId || null;
    let fileName = prev.fileName || null;
    if (pendingFile === 'REMOVE') {
      if (fileId) await DB.deleteFile(fileId);
      fileId = null; fileName = null;
    } else if (pendingFile) {
      if (fileId) await DB.deleteFile(fileId);
      fileId = uid();
      await DB.saveFile(fileId, pendingFile.blob);
      fileName = pendingFile.name;
    }
    c.fatturaOrigine = {
      numero: document.getElementById('ff-numero').value.trim(),
      data: document.getElementById('ff-data').value || '',
      imponibile,
      aliquota: num(document.getElementById('ff-aliquota').value),
      ritenuta: num(document.getElementById('ff-ritenuta').value),
      incassato: prev.incassato || false,
      dataIncasso: prev.dataIncasso || null,
      fileId, fileName
    };
    pendingFile = null;
    persist(); closeModal(); render();
    toast('Fattura salvata');
  }

  // IVA a debito/credito del contesto (cantiere o azienda), escluso l'elemento in modifica.
  // La IVA a credito include SIA le spese materiali SIA i collaboratori.
  function baseIvaContesto(ownerId, escludiId) {
    let debito = 0, credito = 0;
    const addCred = arr => (arr || []).forEach(s => { if (s.id !== escludiId) credito += ivaOf(s.imponibile, s.aliquota); });
    if (ownerId === 'generale') {
      state.cantieri.forEach(c => {
        if (c.fatturaOrigine) debito += ivaOf(c.fatturaOrigine.imponibile, c.fatturaOrigine.aliquota);
        addCred(c.spese); addCred(c.collaboratori);
      });
      addCred(state.speseGenerali);
    } else {
      const c = state.cantieri.find(x => x.id === ownerId);
      if (c) {
        if (c.fatturaOrigine) debito = ivaOf(c.fatturaOrigine.imponibile, c.fatturaOrigine.aliquota);
        addCred(c.spese); addCred(c.collaboratori);
      }
    }
    return { debito, credito };
  }

  // Proiezione live: mostra come questa spesa incide sull'IVA netta prevista
  function wireSpesaProjection(ownerId, escludiId) {
    const base = baseIvaContesto(ownerId, escludiId);
    const upd = () => {
      const imp = num(document.getElementById('sp-imp').value);
      const aliq = num(document.getElementById('sp-aliq').value);
      const thisIva = ivaOf(imp, aliq);
      const creditoTot = base.credito + thisIva;
      const netta = base.debito - creditoTot;
      document.getElementById('sp-deb').textContent = euro(base.debito);
      document.getElementById('sp-cre').innerHTML = euro(creditoTot) + (thisIva ? ` <span class="add">+${euro(thisIva)}</span>` : '');
      const netEl = document.getElementById('sp-net');
      netEl.textContent = euro(Math.abs(netta)) + (netta < 0 ? ' a credito' : ' da versare');
      netEl.className = netta < 0 ? 'credito' : 'versare';
    };
    document.getElementById('sp-imp').addEventListener('input', upd);
    document.getElementById('sp-aliq').addEventListener('change', upd);
    upd();
  }

  async function saveSpesa(ownerId, id) {
    const desc = document.getElementById('sp-desc').value.trim();
    const imponibile = num(document.getElementById('sp-imp').value);
    if (!desc) { toast('Inserisci una descrizione'); return; }
    if (!imponibile) { toast('Inserisci l\'imponibile'); return; }

    const list = ownerId === 'generale'
      ? (state.speseGenerali = state.speseGenerali || [])
      : state.cantieri.find(x => x.id === ownerId).spese;

    let existing = id ? list.find(x => x.id === id) : null;
    let fileId = existing ? existing.fileId : null;
    let fileName = existing ? existing.fileName : null;

    if (pendingFile === 'REMOVE') {
      if (fileId) await DB.deleteFile(fileId);
      fileId = null; fileName = null;
    } else if (pendingFile) {
      if (fileId) await DB.deleteFile(fileId);
      fileId = uid();
      await DB.saveFile(fileId, pendingFile.blob);
      fileName = pendingFile.name;
    }

    const data = {
      descrizione: desc,
      tipo: speseTipoSel,
      fornitore: document.getElementById('sp-forn').value.trim(),
      numeroDoc: document.getElementById('sp-doc').value.trim(),
      imponibile,
      aliquota: num(document.getElementById('sp-aliq').value),
      data: document.getElementById('sp-data').value || '',
      fileId, fileName
    };

    if (existing) { Object.assign(existing, data); toast('Spesa aggiornata'); }
    else { list.unshift(Object.assign({ id: uid() }, data)); toast('Spesa aggiunta'); }

    pendingFile = null;
    persist(); closeModal(); render();
  }

  async function delSpesa(ownerId, id) {
    const list = ownerId === 'generale'
      ? state.speseGenerali
      : state.cantieri.find(x => x.id === ownerId).spese;
    const idx = list.findIndex(x => x.id === id);
    if (idx < 0) return;
    if (!confirm('Eliminare questa spesa?')) return;
    if (list[idx].fileId) await DB.deleteFile(list[idx].fileId);
    list.splice(idx, 1);
    persist(); render(); toast('Spesa eliminata');
  }

  /* ------- Helper form: aliquote, anteprima IVA, file ------- */
  function aliquotaSelect(id, val) {
    // val può essere 0 (0% = esente/reverse charge): distinguo esplicitamente 0 da "non impostato".
    const v = (val === 0 || val) ? num(val) : DEFAULT_ALIQUOTA;
    const label = a => a === 0 ? '0% (esente / reverse charge)' : a + '%';
    return `<select id="${id}">${ALIQUOTE.map(a => `<option value="${a}" ${a === v ? 'selected' : ''}>${label(a)}</option>`).join('')}</select>`;
  }

  function wireIvaPreview(impId, aliqId, previewId, label) {
    const upd = () => {
      const imp = num(document.getElementById(impId).value);
      const aliq = num(document.getElementById(aliqId).value);
      const iva = ivaOf(imp, aliq);
      const tot = totaleOf(imp, aliq);
      document.getElementById(previewId).innerHTML =
        `<span>${label || 'IVA'}: ${euro(iva)}</span><span>Totale: ${euro(tot)}</span>`;
    };
    document.getElementById(impId).addEventListener('input', upd);
    document.getElementById(aliqId).addEventListener('change', upd);
    upd();
  }

  function fileDrop(id, currentName) {
    if (currentName) {
      return `<div class="file-drop has-file" id="${id}-drop">
        <div class="file-current">📎 ${esc(currentName)}
          <button type="button" class="btn btn-danger btn-sm" data-removefile="${id}" style="padding:4px 8px;margin-left:6px">Rimuovi</button>
        </div>
        <div style="margin-top:6px;font-size:.76rem">Tocca per sostituire</div>
      </div>
      <input id="${id}" type="file" accept="image/*,application/pdf" capture="environment" class="hidden">`;
    }
    return `<div class="file-drop" id="${id}-drop">📷 Tocca per scattare una foto o scegliere un file<br><span style="font-size:.74rem">Immagine o PDF</span></div>
      <input id="${id}" type="file" accept="image/*,application/pdf" capture="environment" class="hidden">`;
  }

  function wireFileDrop(id) {
    const drop = document.getElementById(id + '-drop');
    const input = document.getElementById(id);
    if (!drop || !input) return;
    drop.addEventListener('click', (e) => {
      if (e.target.closest('[data-removefile]')) return;
      input.click();
    });
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      pendingFile = { blob: file, name: file.name };
      drop.classList.add('has-file');
      drop.innerHTML = `<div class="file-current">📎 ${esc(file.name)}</div><div style="margin-top:6px;font-size:.76rem">Tocca per sostituire</div>`;
    });
  }

  function saveCategorie() {
    // aggiorna nomi e colori dai campi
    state.categorie.forEach(c => {
      const n = document.querySelector(`[data-catname="${c.id}"]`);
      const col = document.querySelector(`[data-catcolor="${c.id}"]`);
      if (n) c.nome = n.value.trim() || c.nome;
      if (col) c.colore = col.value;
    });
    persist();
    closeModal();
    // se il filtro punta a una categoria eliminata, torna a "tutte"
    if (dashboardFilter !== 'tutte' && dashboardFilter !== 'nessuna' && !getCategoria(dashboardFilter)) {
      dashboardFilter = 'tutte';
    }
    render();
    toast('Categorie aggiornate');

  function addCategoria() {
    const cat = { id: uid(), nome: 'Nuova categoria', colore: randomColor() };
    state.categorie.push(cat);
    // ripiega i valori correnti dei campi prima di ri-renderizzare la modale
    state.categorie.forEach(c => {
      const n = document.querySelector(`[data-catname="${c.id}"]`);
      const col = document.querySelector(`[data-catcolor="${c.id}"]`);
      if (n) c.nome = n.value.trim() || c.nome;
      if (col) c.colore = col.value;
    });
    categorieManager();
    // focus sull'ultimo campo
    const last = document.querySelector(`[data-catname="${cat.id}"]`);
    if (last) { last.focus(); last.select(); }
  }

  function delCategoria(id) {
    const cat = getCategoria(id);
    const usati = state.cantieri.filter(c => c.categoriaId === id).length;
    const msg = usati
      ? `Eliminare "${cat.nome}"? ${usati} cantiere/i passeranno a "Senza categoria".`
      : `Eliminare la categoria "${cat.nome}"?`;
    if (!confirm(msg)) return;
    // salva prima i valori correnti degli altri campi
    state.categorie.forEach(c => {
      const n = document.querySelector(`[data-catname="${c.id}"]`);
      const col = document.querySelector(`[data-catcolor="${c.id}"]`);
      if (n && c.id !== id) c.nome = n.value.trim() || c.nome;
      if (col && c.id !== id) c.colore = col.value;
    });
    state.categorie = state.categorie.filter(c => c.id !== id);
    state.cantieri.forEach(c => { if (c.categoriaId === id) c.categoriaId = ''; });
    if (dashboardFilter === id) dashboardFilter = 'tutte';
    persist();
    categorieManager();
  }

  function randomColor() {
    const palette = ['#1e5eff', '#ffb300', '#16a34a', '#8b5cf6', '#ef4444', '#0ea5e9', '#f97316', '#14b8a6', '#ec4899'];
    return palette[Math.floor(Math.random() * palette.length)];
  }

  async function exportBackup() {
    try {
      const backup = await DB.exportAll(state);
      const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date().toISOString().slice(0, 10);
      a.href = url; a.download = `backup-gestionale-${d}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Backup esportato');
    } catch (e) { console.error(e); toast('Errore durante l\'esportazione'); }
  }

  function doImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('Importare questo backup? I dati attuali verranno sostituiti.')) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const backup = JSON.parse(reader.result);
        const newState = await DB.importAll(backup);
        state = normalizeState(newState);
        persist(); closeModal(); updateHeader();
        route = { name: 'dashboard' }; dashboardFilter = 'tutte';
        render();
        toast('Backup importato con successo');
      } catch (err) { console.error(err); toast('File di backup non valido'); }
    };
    reader.readAsText(file);
  }

      case 'drawer-nav': drawerNav(t.dataset.go); break;
      case 'open-incassi': releaseUrls(); route = { name: 'incassi' }; render(); break;
      case 'incassi-group': incassiGroupBy = t.dataset.by; render(); break;
      case 'open-archivio': route = { name: 'archivio' }; render(); break;

      case 'edit-fattura': fatturaForm(id); break;

      case 'del-fattura': await delFattura(id); break;
      case 'add-spesa': spesaForm(id); break;

        const list = owner === 'generale' ? state.speseGenerali : state.cantieri.find(x => x.id === owner).spese;

      case 'add-collab': collaboratoreForm(id); break;

      case 'import-backup': document.getElementById('import-input').click(); break;
